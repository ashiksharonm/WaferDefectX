[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["python", "frequency_analysis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B905"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
files = ["wafer_inspect"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["wafer_inspect"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File"]

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
follow_imports = "skip"
