name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: |
          ruff check wafer_inspect tests scripts benchmarks
          ruff format --check wafer_inspect tests scripts benchmarks
      - name: Type check
        run: mypy
      - name: Tests with coverage
        run: |
          pytest --cov --cov-report=term-missing --cov-report=xml
          { echo '### Coverage'; echo '```'; coverage report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Active-learning experiment (labels needed vs random sampling)
        run: |
          python -m wafer_inspect.active_learning --target 0.9 --out reports/active_learning.json | tee al.txt
          { echo '### Active learning (synthetic data, CPU)'; echo '```'; cat al.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: active-learning
          path: reports/active_learning.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image (trains the model inside the build)
        run: docker build -t wafer-inspect:ci .
      - name: Smoke test the API and review queue
        run: |
          docker run -d --name api -p 7860:7860 wafer-inspect:ci
          for i in $(seq 1 30); do curl -sf localhost:7860/readyz && break; sleep 2; done
          curl -sf localhost:7860/readyz
          queued=0
          for f in samples/*.png; do
            r=$(curl -sf -F "file=@$f" localhost:7860/predict)
            echo "$f $r"
            echo "$r" | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin)['needs_review'] else 1)" && queued=$((queued+1)) || true
          done
          echo "queued: $queued"
          rows=$(curl -sf "localhost:7860/queue/export?format=csv" | tail -n +2 | wc -l)
          test "$rows" -eq "$queued"
          curl -sf localhost:7860/metrics-report | tee metrics.json
          { echo '### Container smoke test'; echo "queued $queued of $(ls samples/*.png | wc -l) sample wafers"; echo '```'; cat metrics.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          docker tag wafer-inspect:ci "$IMAGE:latest"
          docker tag wafer-inspect:ci "$IMAGE:${GITHUB_SHA::7}"
          docker push --all-tags "$IMAGE"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ libopencv-dev
          pip install -r requirements.txt
      - name: Build C++ core
        run: cmake -S cpp -B cpp/build -DCMAKE_BUILD_TYPE=Release && cmake --build cpp/build -j2
        continue-on-error: true
      - run: python -m wafer_inspect.train --out models
      - name: Benchmark (measured on this runner)
        run: |
          python benchmarks/bench.py --out benchmarks/results/bench.json | tee bench.txt
          {
            echo '### Latency benchmark (GitHub Actions runner CPU; shared VM, expect noise)'
            echo '```'; cat bench.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: benchmarks/results/bench.json
